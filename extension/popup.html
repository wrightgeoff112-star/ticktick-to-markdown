<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TickTick → Markdown</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #09090b;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #18181b;
        --accent-fg: #fafafa;
        --ok: #16a34a;
        --warn: #d97706;
        --err: #dc2626;
        --radius: 8px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #27272a;
          --accent: #fafafa;
          --accent-fg: #18181b;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
          system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 { font-size: 15px; margin: 0; }
      .subtitle { color: var(--muted); font-size: 12px; margin: 2px 0 14px; }

      /* 站点切换：label 可见、位置固定；input 隐藏但保留 DOM 相邻。 */
      .segmented {
        display: flex;
        margin-bottom: 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .segmented input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .segmented label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        text-align: center;
        padding: 8px 10px;
        cursor: pointer;
        color: var(--muted);
        border-right: 1px solid var(--border);
        transition: background 0.12s, color 0.12s;
      }
      .segmented label[data-lang="en"] { border-right: none; }
      .segmented input:checked + label {
        background: var(--accent);
        color: var(--accent-fg);
      }

      section { margin-bottom: 14px; }
      .step-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
      .step-list { color: var(--muted); font-size: 12px; margin: 0; padding-left: 18px; }
      .step-list li { margin: 2px 0; }

      .file-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .file-btn {
        display: inline-block;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 12px;
      }
      #csv-picked { font-size: 12px; color: var(--muted); }
      .hint {
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        margin: 2px 0 10px;
      }
      #csv-picked[data-on="true"] { color: var(--ok); }
      #csv-file { display: none; }

      .check-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 14px; cursor: pointer; }
      .check-row input { margin: 0; }

      button {
        width: 100%;
        padding: 9px 12px;
        border: none;
        border-radius: var(--radius);
        background: var(--accent);
        color: var(--accent-fg);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }

      #status { margin-top: 10px; font-size: 12px; min-height: 1em; }
      #status[data-kind="ok"] { color: var(--ok); }
      #status[data-kind="warn"] { color: var(--warn); }
      #status[data-kind="error"] {
        color: var(--err);
        background: color-mix(in srgb, var(--err) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--err) 30%, transparent);
        padding: 6px 8px;
        border-radius: var(--radius);
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="title">滴答清单导出 Markdown</h1>
    <div class="subtitle" data-i18n="subtitle">任务数据 → Markdown</div>

    <div class="segmented" data-active-lang="zh">
      <input type="radio" id="host-dida" name="host" value="dida365" checked />
      <label for="host-dida" data-lang="zh" data-i18n="hostCn">中国站</label>
      <input type="radio" id="host-tick" name="host" value="ticktick" />
      <label for="host-tick" data-lang="en" data-i18n="hostEn">全球站</label>
    </div>

    <section>
      <div class="step-title" data-i18n="step1Title">① 从滴答清单导出数据</div>
      <ol class="step-list">
        <li data-i18n="step1Login">登录网页版（dida365.com）</li>
        <li data-i18n="step1Settings">左上角头像 → 设置 → 账号与安全</li>
        <li data-i18n="step1Backup">导入与备份 → 数据备份 → 生成备份</li>
        <li data-i18n="step1Download">下载得到 CSV 文件</li>
      </ol>
    </section>

    <section>
      <div class="step-title" data-i18n="step2Title">② 导出成 Markdown</div>
      <div class="file-row">
        <label for="csv-file" class="file-btn" data-i18n="csvLabel">选择 CSV 文件</label>
        <span id="csv-picked"></span>
      </div>
      <input type="file" id="csv-file" accept=".csv" />
      <p class="hint" data-i18n="csvHint">
        选择上一步得到的 CSV 文件，即可生成一套带 YAML frontmatter 的 Markdown 笔记，可直接用于 Obsidian 等软件。如需连同附件图片一并导出，请勾选下方选项。
      </p>
      <label class="check-row">
        <input type="checkbox" id="with-images" />
        <span data-i18n="withImages">同步获取附件图片（需本浏览器已登录滴答清单网页版）</span>
      </label>
      <button id="download-btn" data-i18n="download">下载</button>
    </section>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
